<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>擊擊復擊擊 - Percussion Practice Suite</title>
    <style>
        body {
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
            padding: 20px 10px;
            box-sizing: border-box;
        }
        #game-container { 
            text-align: center; 
            position: relative; 
            width: 100%;
            max-width: 850px; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 36px; margin: 10px 0 5px 0; color: #00cec9; letter-spacing: 3px; }
        .credits { font-size: 14px; color: #747d8c; margin-bottom: 25px; }
        
        .mode-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 20px; }
        .mode-row { display: flex; align-items: center; gap: 12px; }
        .orientation-hint { font-size: 14px; color: #a4b0be; font-weight: bold; }
        
        #canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border: 4px solid #2f3542;
            background-color: #151518;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
            overflow: hidden;
        }
        
        .wrapper-taiko { aspect-ratio: 800 / 520; max-width: 800px !important; }
        /* Reduced vertical stretch for desktop layout to prevent scrolling */
        .wrapper-phigros { aspect-ratio: 450 / 580; max-width: 450px !important; }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background: transparent;
        }
        
        #ui-overlay { margin-top: 15px; font-size: 18px; min-height: 45px; color: #eccc68; font-weight: 500; }
        
        .btn {
            background: #2f3542;
            color: #a4b0be;
            border: 2px solid #57606f;
            padding: 14px 32px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.2s ease;
            min-width: 160px;
        }
        .btn.selected {
            background: #00cec9;
            color: #0c0c0e;
            border-color: #00cec9;
            box-shadow: 0 0 15px rgba(0, 206, 201, 0.4);
        }
        .btn-action {
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 16px 48px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            box-shadow: 0 4px 14px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }
        .btn-action:disabled {
            background: #2f3542 !important;
            color: #57606f !important;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }
        .btn-action:hover:not(:disabled) { background: #ff6b81; transform: translateY(-2px); }
        
        #action-btn-container {
            position: relative;
            margin-top: -10px;
            z-index: 20;
            width: 100%;
        }
        
        .modern-next-btn {
            position: absolute;
            bottom: 100px; /* Safe position for Taiko */
            right: 45px;
            background: #ffffff;
            color: #0c0c0e;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.15);
            z-index: 10;
            letter-spacing: 1px;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }
        .modern-next-btn:hover:not(:disabled) { 
            transform: translateY(-2px); 
            background: #00cec9; 
            color: #0c0c0e;
            box-shadow: 0 6px 25px rgba(0, 206, 201, 0.4);
        }
        .modern-next-btn:disabled { background: #2f3542; color: #57606f; cursor: not-allowed; opacity: 0.4; box-shadow: none; }
        .modern-next-btn svg { width: 18px; height: 18px; fill: currentColor; transition: transform 0.2s ease; }
        .modern-next-btn:hover svg { transform: translateX(3px); }

        #tutorial-panel {
            background: #1e1e24;
            border: 2px solid #2f3542;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }
        #tutorial-panel h3 { color: #00cec9; margin-top: 0; }
        #tutorial-panel code { background: #0c0c0e; padding: 2px 6px; border-radius: 4px; color: #ff7f50; }
        
        #audio-status {
            font-size: 14px;
            color: #ffd32a;
            margin-bottom: 15px;
            font-weight: bold;
            min-height: 20px;
        }

        #orientation-guard {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0c0c0e;
            color: #ffffff;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        #orientation-guard svg {
            width: 65px;
            height: 65px;
            fill: #00cec9;
            margin-bottom: 20px;
        }
        .animate-to-landscape { animation: rotateLandscape 2s ease-in-out infinite; }
        .animate-to-portrait { animation: rotatePortrait 2s ease-in-out infinite; }

        @keyframes rotateLandscape {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes rotatePortrait {
            0% { transform: rotate(-90deg); }
            50% { transform: rotate(0deg); }
            100% { transform: rotate(-90deg); }
        }
        #orientation-guard h2 { font-size: 24px; margin: 0 0 10px 0; color: #00cec9; }
        #orientation-guard p { font-size: 15px; color: #a4b0be; margin: 0; }

        /* Media Query for Phone Landscape/Portrait Rules Only */
        @media screen and (max-width: 1024px) {
            body {
                padding: 5px 10px;
            }
            /* Retain full tall scale specifically for portrait phone layout on Phigros */
            .wrapper-phigros { 
                aspect-ratio: 450 / 680 !important; 
            }
            .modern-next-btn {
                bottom: 82px !important; /* Adjusted to sit at the exact canvas visual alignment axis */
            }
            .phigros-mobile-btn {
                margin-top: -15px !important; /* Move "再玩一次" upwards safely */
            }
        }
    </style>
</head>
<body>

<div id="orientation-guard">
    <svg id="guard-svg" viewBox="0 0 24 24">
        <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
    </svg>
    <h2 id="guard-title">請調整手機方向</h2>
    <p id="guard-desc">Please rotate your device to continue.</p>
</div>

<div id="game-container">
    <div id="menu">
        <h1>擊擊復擊擊</h1>
        <div class="credits">製作者: 郭覲德 林映澄</div>
        
        <div id="tutorial-panel">
            <h3>玩法教學 (Tutorial)</h3>
            • <b>太鼓模式：</b>音符抵達左側判定圈時，按下 <code>空白鍵 (Space)</code> ；<b>手機操作：</b>點擊螢幕任意處進行敲擊。<br>
            • <b>音遊模式：</b>矩形條由上往下掉落，抵達底部判定線時，按對應軌道鍵 <code>A</code> <code>S</code> <code>D</code> <code>F</code> ；<b>手機操作：</b>點擊底部對應的四個軌道區域。<br>
            • <b>判定精準度：</b>越接近完美時間點分數越高，分為 <span style="color:#ffffff">完美</span>、<span style="color:#ffffff">良</span>、<span style="color:#ffffff">差</span>、<span>MISS</span>。
        </div>

        <div id="audio-status">⏳ 初始化音訊與加載樂器中，請點擊任意處開始...</div>

        <div class="mode-container">
            <div class="mode-row">
                <button id="btn-taiko" class="btn" onclick="selectMode('taiko')">太鼓模式</button>
                <span class="orientation-hint">💡 (建議使用橫螢幕)</span>
            </div>
            <div class="mode-row">
                <button id="btn-phigros" class="btn" onclick="selectMode('phigros')">音遊模式</button>
                <span class="orientation-hint">💡 (建議使用直螢幕)</span>
            </div>
        </div>
        
        <button id="btn-start" class="btn-action" onclick="startGame()" disabled>開始遊戲</button>
    </div>

    <div id="canvas-wrapper" style="display:none;">
        <canvas id="gameCanvas" width="800" height="520"></canvas>
    </div>
    <div id="ui-overlay"></div>
    <div id="action-btn-container"></div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const menu = document.getElementById('menu');
const canvasWrapper = document.getElementById('canvas-wrapper');
const actionBtnContainer = document.getElementById('action-btn-container');
const audioStatusDiv = document.getElementById('audio-status');

const btnTaiko = document.getElementById('btn-taiko');
const btnPhigros = document.getElementById('btn-phigros');
const btnStart = document.getElementById('btn-start');

const guardOverlay = document.getElementById('orientation-guard');
const guardSvg = document.getElementById('guard-svg');
const guardTitle = document.getElementById('guard-title');
const guardDesc = document.getElementById('guard-desc');

// --- ENGINE CONSTANTS (60 BPM) ---
const BPM = 60;
const BEAT_DURATION = 60 / BPM; 
const SUB_BEAT_DURATION = BEAT_DURATION / 4; 
const WINDOW_MAX = 0.125; 

const BEAT_PATTERNS = {
    1: [1, 0, 0, 0], 2: [1, 0, 1, 0], 3: [1, 1, 1, 1], 4: [1, 0, 1, 1],
    5: [1, 1, 1, 0], 6: [1, 1, 0, 1], 7: [1, 1, 0, 0], 8: [1, 0, 0, 1]
};

// --- COMMENTARY POOLS ---
const INDIVIDUAL_COMMENTS = {
    tier1: ["海倫凱勒都比你強。", "你試了。我們注意到了。就這樣。", "我阿公都比你行。", "連一根皮毛都沒摸到。"],
    tier2: ["就這?", "中庸。字典裡最無趣的詞。", "你還好嗎?"],
    tier3: ["你抓到大概了。真的只有大概。", "還行吧。", "看來你還是有點東西的。只有一點點。"],
    tier4: ["我們注意到你的表現了。現在開心了嗎?", "勉強能拿來炫耀。", "好吧。我承認你有點實力。"],
    tier5: ["精確到讓人作嘔。", "挺沒用的能力其實。", "近乎完美都不足以形容你。", "外星人，你被我們逮捕了。"]
};

const OVERALL_COMMENTS = {
    tier1: ["海倫凱勒都比你強。", "你試了。我們注意到了。就這樣。", "我阿公都比你行。", "連一根皮毛都沒摸到。"],
    tier2: ["就這?", "中庸。字典裡最無趣的詞。", "你還好嗎?"],
    tier3: ["你抓到大概了。真的只有大概。", "還行吧。", "看來你還是有點東西的。只有一點點。"],
    tier4: ["我們注意到你的表現了。現在開心了嗎?", "勉強能拿來炫耀。", "好吧。我承認你有點實力。"],
    tier5: ["精確到讓人作嘔。", "挺沒用的能力其實。", "近乎完美都不足以形容你。", "外星人，你被我們逮捕了。"]
};

function getCommentaryByPoints(score, isOverall = false) {
    if (!isOverall) {
        if (score < 5.0) return INDIVIDUAL_COMMENTS.tier1[Math.floor(Math.random() * INDIVIDUAL_COMMENTS.tier1.length)];
        if (score < 7.0) return INDIVIDUAL_COMMENTS.tier2[Math.floor(Math.random() * INDIVIDUAL_COMMENTS.tier2.length)];
        if (score < 8.5) return INDIVIDUAL_COMMENTS.tier3[Math.floor(Math.random() * INDIVIDUAL_COMMENTS.tier3.length)];
        if (score < 9.5) return INDIVIDUAL_COMMENTS.tier4[Math.floor(Math.random() * INDIVIDUAL_COMMENTS.tier4.length)];
        return INDIVIDUAL_COMMENTS.tier5[Math.floor(Math.random() * INDIVIDUAL_COMMENTS.tier5.length)];
    } else {
        let normalizedScore = (currentMode === 'phigros') ? (score / 2) : score;
        if (normalizedScore <= 35.0) return OVERALL_COMMENTS.tier1[Math.floor(Math.random() * OVERALL_COMMENTS.tier1.length)];
        if (normalizedScore <= 40.0) return OVERALL_COMMENTS.tier2[Math.floor(Math.random() * OVERALL_COMMENTS.tier2.length)];
        if (normalizedScore <= 45.0) return OVERALL_COMMENTS.tier3[Math.floor(Math.random() * OVERALL_COMMENTS.tier3.length)];
        if (normalizedScore <= 48.0) return OVERALL_COMMENTS.tier4[Math.floor(Math.random() * OVERALL_COMMENTS.tier4.length)];
        return OVERALL_COMMENTS.tier5[Math.floor(Math.random() * OVERALL_COMMENTS.tier5.length)];
    }
}

// --- AUDIO SYNTHESIS & FILE LOADING ---
let audioCtx = null;
const drumBuffers = { 0: null, 1: null, 2: null, 3: null };
let audioLoaded = false;

const DRUM_URLS = {
    0: 'https://raw.githubusercontent.com/scratchfoundation/scratch-audio/develop/sound-files/drums/BassDrum(1b)_22k.wav',
    1: 'https://raw.githubusercontent.com/scratchfoundation/scratch-audio/develop/sound-files/drums/SnareDrum(1)_22k.wav',
    2: 'https://raw.githubusercontent.com/scratchfoundation/scratch-audio/develop/sound-files/drums/HiHatClosed(1)_22k.wav',
    3: 'https://raw.githubusercontent.com/scratchfoundation/scratch-audio/develop/sound-files/drums/HiHatOpen(2)_22k.wav'
};

function warmupAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function loadDrumSounds() {
    if (audioLoaded) return;
    warmupAudioContext();
    audioStatusDiv.style.color = '#ffd32a';
    audioStatusDiv.innerText = '⏳ 正在為您加載音遊專屬打擊樂器組...';
    
    try {
        const promises = Object.keys(DRUM_URLS).map(async (key) => {
            const response = await fetch(DRUM_URLS[key]);
            const arrayBuffer = await response.arrayBuffer();
            return new Promise((resolve) => {
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    drumBuffers[key] = buffer;
                    resolve();
                });
            });
        });
        
        await Promise.all(promises);
        audioLoaded = true;
        audioStatusDiv.style.color = '#0be881';
        audioStatusDiv.innerText = '✅ 樂器打擊音效載入完成！請選擇遊戲模式';
        if (currentMode) {
            btnStart.disabled = false;
            btnStart.style.background = '#00cec9';
            btnStart.style.color = '#0c0c0e';
        }
    } catch (error) {
        audioStatusDiv.style.color = '#ff4757';
        audioStatusDiv.innerText = '⚠️ 音檔加載失敗，將使用系統內建合成器替代';
        audioLoaded = true; 
        if (currentMode) btnStart.disabled = false;
    }
}

window.addEventListener('click', loadDrumSounds, { once: true });
window.addEventListener('keydown', loadDrumSounds, { once: true });
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(loadDrumSounds, 800);
    checkOrientation();
});

function playHitSound(column = null) {
    warmupAudioContext();
    if (currentMode === 'phigros' && column !== null && drumBuffers[column]) {
        const source = audioCtx.createBufferSource();
        source.buffer = drumBuffers[column];
        if (column === 3) source.playbackRate.setValueAtTime(0.8, audioCtx.currentTime);
        source.connect(audioCtx.destination);
        source.start(0);
        return;
    }
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(column === null ? 65 : 70 + column * 40, audioCtx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
    gainNode.gain.setValueAtTime(0.95, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
}

function scheduleBeep(frequency, startTime, duration, step) {
    warmupAudioContext();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'square'; 
    osc.frequency.setValueAtTime(frequency, startTime);
    gainNode.gain.setValueAtTime(0.2, startTime); 
    if (step === 4) {
        gainNode.gain.setValueAtTime(0.2, startTime);
        gainNode.gain.linearRampToValueAtTime(0.0, startTime + 0.75);
    } else {
        gainNode.gain.setValueAtTime(0.2, startTime + duration - 0.01);
        gainNode.gain.linearRampToValueAtTime(0.0, startTime + duration);
    }
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + (step === 4 ? 0.75 : duration));
}

function playScoreTickSound(val, maxVal) {
    warmupAudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    let ratio = val / maxVal;
    osc.frequency.setValueAtTime(150 + (ratio * 400), audioCtx.currentTime);
    gain.gain.setValueAtTime(0.10, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
}

// --- ASSET MANAGEMENT ---
const images = {};
for (let i = 1; i <= 6; i++) {
    images[i] = new Image();
    images[i].src = `${i}.jpg`;
}

// --- STATE MANAGEMENT ---
let currentMode = '';
let gameState = 'START'; 
let currentQuestionIndex = 0;
let questions = [];
let questionScores = [];
let activeNotes = [];
let timelineStartTime = 0; 
let lastCountdownBeatRegistered = -1;
let currentCombo = 0; 
let rollingScoreDisplay = 0.0;
let targetFinalScore = 0.0;
let lastTickTime = 0;
let currentActiveCommentary = ""; 
let validHitsOffsetSum = 0;
let validHitsCount = 0;
let scoreFinishedRisingGlobal = false;
let resultViewStartTimestamp = 0;

function checkOrientation() {
    if (window.innerWidth > 1024) {
        guardOverlay.style.display = 'none';
        return;
    }
    let isLandscape = window.innerWidth > window.innerHeight;
    if (currentMode === 'taiko') {
        if (!isLandscape) {
            guardOverlay.style.display = 'flex';
            guardSvg.className = 'animate-to-landscape';
            guardTitle.innerText = '請將手機旋轉至橫螢幕';
            guardDesc.innerText = 'Please rotate your device to landscape mode to play Taiko.';
        } else {
            guardOverlay.style.display = 'none';
        }
    } else if (currentMode === 'phigros') {
        if (isLandscape) {
            guardOverlay.style.display = 'flex';
            guardSvg.className = 'animate-to-portrait';
            guardTitle.innerText = '請將手機旋轉至直螢幕';
            guardDesc.innerText = 'Please rotate your device to portrait mode to play Phigros.';
        } else {
            guardOverlay.style.display = 'none';
        }
    } else {
        guardOverlay.style.display = 'none';
    }
}

window.addEventListener('resize', checkOrientation);
window.addEventListener('orientationchange', checkOrientation);

function selectMode(mode) {
    currentMode = mode;
    warmupAudioContext();
    if (mode === 'taiko') {
        btnTaiko.classList.add('selected');
        btnPhigros.classList.remove('selected');
        canvasWrapper.className = '';
        canvasWrapper.classList.add('wrapper-taiko');
        canvas.width = 800;
        canvas.height = 520;
    } else {
        btnPhigros.classList.add('selected');
        btnTaiko.classList.remove('selected');
        canvasWrapper.className = '';
        canvasWrapper.classList.add('wrapper-phigros');
        canvas.width = 450;
        // Adjust system height canvas constraints for specific platforms
        canvas.height = (window.innerWidth <= 1024) ? 680 : 580;
    }
    checkOrientation();
    if (audioLoaded) {
        btnStart.disabled = false;
        btnStart.style.background = '#00cec9';
        btnStart.style.color = '#0c0c0e';
    } else {
        audioStatusDiv.innerText = '⏳ 模式已選，請等待音檔載入完成後即可開始遊戲...';
    }
}

function startGame() {
    if (!currentMode || !audioLoaded) return;
    menu.style.display = 'none';
    canvasWrapper.style.display = 'block';
    currentCombo = 0; 
    generateSession();
    buildTimelineForQuestion();
    requestAnimationFrame(gameLoop);
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function generateSession() {
    questions = [];
    questionScores = [];
    currentQuestionIndex = 0;
    if (currentMode === 'taiko') {
        for(let i = 0; i < 5; i++) {
            let structuralPool = [1, 2, 3, 4, 5, 6];
            shuffleArray(structuralPool);
            let patternCombination = [structuralPool[0], structuralPool[1], structuralPool[2], structuralPool[3]];
            questions.push(patternCombination);
        }
    } else {
        let phigrosTrackBeats = [];
        for (let i = 0; i < 16; i++) {
            phigrosTrackBeats.push(Math.floor(Math.random() * 6) + 1);
        }
        questions.push(phigrosTrackBeats);
    }
}

function calculateAccuracyScore(offset) {
    let x = Math.abs(offset);
    if (x >= 0.120) return 0.0;
    let score = 10.0 * Math.exp(-252 * (x * x));
    return Math.max(0.0, Math.min(10.0, score));
}

function getJudgmentData(offset, isMissedEntirely) {
    if (isMissedEntirely) return { color: '#ff4d4d', text: '' }; 
    let absOffset = Math.abs(offset);
    if (absOffset <= 0.030) return { color: '#ffffff', text: '完美' };   
    if (absOffset <= 0.060) return { color: '#ffffff', text: '良' };      
    if (absOffset <= 0.120) return { color: '#ffffff', text: '差' };       
    return { color: '#ff4d4d', text: '' };                              
}

function buildTimelineForQuestion() {
    gameState = 'TIMELINE_RUNNING';
    scoreFinishedRisingGlobal = false;
    actionBtnContainer.innerHTML = '';
    timelineStartTime = performance.now() / 1000;
    lastCountdownBeatRegistered = -1;
    activeNotes = [];
    validHitsOffsetSum = 0;
    validHitsCount = 0;
    let noteIdCounter = 0;
    
    if (currentMode === 'taiko') {
        let patternIDs = questions[currentQuestionIndex];
        for (let beatIdx = 0; beatIdx < 4; beatIdx++) {
            let patternNum = patternIDs[beatIdx];
            let subBeatMask = BEAT_PATTERNS[patternNum];
            for (let subIdx = 0; subIdx < 4; subIdx++) {
                if (subBeatMask[subIdx] === 1) {
                    let targetTime = (4 * BEAT_DURATION) + (beatIdx * BEAT_DURATION) + (subIdx * SUB_BEAT_DURATION);
                    let randomizedColumn = Math.floor(Math.random() * 4); 
                    activeNotes.push({
                        id: noteIdCounter++, 
                        targetOffset: targetTime,
                        column: randomizedColumn,
                        patternOrigin: patternNum,
                        hitScore: null,
                        hitOffset: null,
                        processed: false,   
                        missedEntirely: false
                    });
                }
            }
        }
    } else {
        let trackBeatsArray = questions[0]; 
        trackBeatsArray.forEach((patternNum, beatIdx) => {
            let subBeatMask = BEAT_PATTERNS[patternNum] || [1, 0, 0, 0];
            for (let subIdx = 0; subIdx < 4; subIdx++) {
                if (subBeatMask[subIdx] === 1) {
                    let targetTime = (4 * BEAT_DURATION) + (beatIdx * BEAT_DURATION) + (subIdx * SUB_BEAT_DURATION);
                    let randomizedColumn = Math.floor(Math.random() * 4);
                    activeNotes.push({
                        id: noteIdCounter++,
                        targetOffset: targetTime,
                        column: randomizedColumn,
                        patternOrigin: patternNum,
                        hitScore: null,
                        hitOffset: null,
                        processed: false,
                        missedEntirely: false
                    });
                }
            }
        });
    }
}

function endQuestion() {
    gameState = 'QUESTION_SCORE';
    currentCombo = 0; 
    scoreFinishedRisingGlobal = false;
    resultViewStartTimestamp = performance.now() / 1000;
    
    let totalNotes = activeNotes.length;
    let accumulated = 0;
    activeNotes.forEach(note => { accumulated += note.hitScore; });
    let avg = totalNotes > 0 ? accumulated / totalNotes : 0.0;
    
    if (currentMode === 'taiko') {
        questionScores.push(avg);
        rollingScoreDisplay = 0.0;
        targetFinalScore = avg;
        currentActiveCommentary = getCommentaryByPoints(avg, false);
        
        let nextClickAction = (currentQuestionIndex < 4) ? "nextQuestion()" : "showGrandScoreboard()";
        actionBtnContainer.innerHTML = `
            <button id="btn-next-step" class="modern-next-btn" onclick="${nextClickAction}" disabled>
                <span>下一步</span>
                <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>`;
    } else {
        let scaledGrandScore = avg * 10.0; 
        questionScores.push(scaledGrandScore);
        rollingScoreDisplay = 0.0;
        targetFinalScore = scaledGrandScore;
        currentActiveCommentary = getCommentaryByPoints(scaledGrandScore, true);
        
        actionBtnContainer.innerHTML = `<button id="btn-next-step" class="btn-action phigros-mobile-btn" onclick="location.reload()" disabled>再玩一次</button>`;
    }
    lastTickTime = performance.now();
}

function nextQuestion() {
    currentQuestionIndex++;
    buildTimelineForQuestion();
}

function showGrandScoreboard() {
    gameState = 'FINAL_SCOREBOARD';
    rollingScoreDisplay = 0.0;
    targetFinalScore = questionScores.reduce((a, b) => a + b, 0);
    lastTickTime = performance.now();
    currentActiveCommentary = getCommentaryByPoints(targetFinalScore, true);
    actionBtnContainer.innerHTML = `<button class="btn-action phigros-mobile-btn" onclick="location.reload()">再玩一次</button>`;
}

function handleHit(forcedColumn = null) {
    if (gameState !== 'TIMELINE_RUNNING') return;
    let relativeTime = (performance.now() / 1000) - timelineStartTime;
    let countdownEndTime = 4 * BEAT_DURATION;
    if (relativeTime >= (countdownEndTime - WINDOW_MAX)) {
        playHitSound(forcedColumn);
    }
    for (let i = 0; i < activeNotes.length; i++) {
        let note = activeNotes[i];
        if (!note.processed) {
            if (forcedColumn !== null && note.column !== forcedColumn) continue; 
            let timeDifference = relativeTime - note.targetOffset;
            if (Math.abs(timeDifference) <= WINDOW_MAX) {
                note.hitOffset = timeDifference;
                note.hitScore = calculateAccuracyScore(timeDifference);
                note.processed = true; 
                note.hitTimestamp = relativeTime;
                validHitsOffsetSum += timeDifference;
                validHitsCount++;
                let judgment = getJudgmentData(timeDifference, false);
                if (judgment.text === '完美' || judgment.text === '良') {
                    currentCombo++;
                } else {
                    currentCombo = 0; 
                }
                break; 
            }
        }
    }
}

window.addEventListener('keydown', (e) => { 
    if (currentMode === 'taiko' && e.code === 'Space') {
        e.preventDefault();
        handleHit(null);
    } 
    else if (currentMode === 'phigros') {
        let targets = { 'KeyA': 0, 'KeyS': 1, 'KeyD': 2, 'KeyF': 3 };
        if (targets[e.code] !== undefined) {
            e.preventDefault();
            handleHit(targets[e.code]);
        }
    }
});

canvas.addEventListener('touchstart', (e) => {
    if (gameState !== 'TIMELINE_RUNNING') return;
    e.preventDefault(); 
    if (currentMode === 'taiko') {
        handleHit(null);
    } 
    else if (currentMode === 'phigros') {
        let rect = canvas.getBoundingClientRect();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            let canvasRelativeX = touch.clientX - rect.left;
            let calculatedColumn = Math.floor((canvasRelativeX / rect.width) * 4);
            calculatedColumn = Math.max(0, Math.min(3, calculatedColumn));
            handleHit(calculatedColumn);
        }
    }
}, {passive: false});

function getOptimizedScoreScreenTimeline() {
    let generatedOffsets = [];
    let currentOffset = 0;
    let consecutiveGaps = 0;
    for (let i = 0; i < 32; i++) {
        let randSpawn = Math.random() > 0.45;
        if (!randSpawn) {
            consecutiveGaps++;
            if (consecutiveGaps >= 2) randSpawn = true; 
        }
        if (randSpawn) {
            consecutiveGaps = 0;
            generatedOffsets.push(currentOffset);
        }
        currentOffset += SUB_BEAT_DURATION;
    }
    return generatedOffsets;
}

const scoreBackgroundTimelinePool = getOptimizedScoreScreenTimeline();

function drawFadedGameplayBackground(simulatedRelativeTime, trackOffsetY) {
    ctx.save();
    let judgmentLineX = 220;
    let trackBaseY = 320 + trackOffsetY;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 4;
    ctx.beginPath(); 
    ctx.arc(judgmentLineX, trackBaseY, 45, 0, Math.PI * 2); 
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(0, trackBaseY - 50, canvas.width, 100); 
    
    scoreBackgroundTimelinePool.forEach(targetOffset => {
        let targetTimeModulo = targetOffset % (8 * BEAT_DURATION);
        let xPos = judgmentLineX + ((targetTimeModulo - simulatedRelativeTime) * 400);
        if (xPos > -40 && xPos < canvas.width + 40) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.55)'; 
            ctx.beginPath(); ctx.arc(xPos, trackBaseY, 28, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255, 56, 56, 0.65)'; 
            ctx.beginPath(); ctx.arc(xPos, trackBaseY, 21, 0, Math.PI * 2); ctx.fill();
        }
    });
    ctx.restore();
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let timeNow = performance.now() / 1000;
    let relativeTime = timeNow - timelineStartTime;
    let countdownEndTime = 4 * BEAT_DURATION;
    
    let isMobilePhone = window.innerWidth <= 1024;
    let isLandscape = window.innerWidth > window.innerHeight;
    
    // Core Layout Metrics for Phone Horizontal Mode Viewports
    let phoneHorizontalGameplayShiftY = (currentMode === 'taiko' && isMobilePhone && isLandscape) ? Math.floor(canvas.height * 0.33) : 0;
    let phoneHorizontalScoreShiftY = (currentMode === 'taiko' && isMobilePhone && isLandscape) ? Math.floor(canvas.height * 0.25) : 0;

    // 1. Gameplay Frame Processing View
    if (gameState === 'TIMELINE_RUNNING') {
        let maxDurationBeats = (currentMode === 'taiko') ? 8 : 20; 
        ctx.save();
        
        if (currentMode === 'taiko') {
            let patternIDs = questions[currentQuestionIndex];
            
            // Shift cards down another 1/3 of track height to fully reveal them on mobile webviews
            let cardPanelHeight = 110;
            let cardPanelY = (isMobilePhone && isLandscape) ? 65 : 0; 
            let scaleFactorCard = (isMobilePhone && isLandscape) ? 0.8 : 1.0;
            
            ctx.fillStyle = '#1e1e24';
            ctx.fillRect(0, cardPanelY, canvas.width, cardPanelHeight);
            
            let currentActiveImageIndex = -1;
            if (relativeTime >= countdownEndTime) {
                currentActiveImageIndex = Math.floor((relativeTime - countdownEndTime) / BEAT_DURATION);
            }
            
            let totalAvailableWidth = canvas.width * scaleFactorCard;
            let imgWidth = totalAvailableWidth / 4; 
            let centeringStartX = (canvas.width - totalAvailableWidth) / 2;
            
            for (let i = 0; i < 4; i++) {
                let imgId = patternIDs[i];
                let xPos = centeringStartX + (i * imgWidth);
                if (images[imgId] && images[imgId].complete) {
                    ctx.drawImage(images[imgId], xPos, cardPanelY, imgWidth, cardPanelHeight);
                } else {
                    ctx.strokeStyle = '#3a3a44';
                    ctx.strokeRect(xPos, cardPanelY, imgWidth, cardPanelHeight);
                    ctx.fillStyle = '#fff';
                    ctx.font = `${Math.floor(14 * scaleFactorCard)}px Segoe UI`;
                    ctx.fillText(`卡片 ${imgId}.jpg`, xPos + (15 * scaleFactorCard), cardPanelY + (cardPanelHeight / 2));
                }
                if (i === currentActiveImageIndex) {
                    ctx.strokeStyle = '#00cec9';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(xPos + 2, cardPanelY + 2, imgWidth - 4, cardPanelHeight - 4);
                }
            }

            // Move 1/5 layout matrix indicator downwards cleanly alongside other score parameters
            ctx.save();
            ctx.fillStyle = '#a4b0be';
            ctx.font = 'bold 20px Arial, sans-serif';
            let labelRoundY = isMobilePhone && isLandscape ? 205 + phoneHorizontalGameplayShiftY : 145;
            ctx.fillText(`${currentQuestionIndex + 1} / 5`, 25, labelRoundY);
            ctx.restore();
        }

        if (relativeTime < countdownEndTime) {
            let currentCountdownBeat = Math.floor(relativeTime / BEAT_DURATION);
            if (currentCountdownBeat !== lastCountdownBeatRegistered && currentCountdownBeat < 4) {
                lastCountdownBeatRegistered = currentCountdownBeat;
                let ctxTime = audioCtx.currentTime;
                if (currentCountdownBeat === 0) scheduleBeep(470, ctxTime, 0.12, 1);
                else if (currentCountdownBeat === 1) scheduleBeep(470, ctxTime, 0.12, 2);
                else if (currentCountdownBeat === 2) scheduleBeep(470, ctxTime, 0.12, 3);
                else if (currentCountdownBeat === 3) scheduleBeep(940, ctxTime, 0.75, 4); 
            }
        }

        if (currentMode === 'taiko') {
            let judgmentLineX = 220;
            let trackBaseY = 320 + phoneHorizontalGameplayShiftY;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath(); 
            ctx.arc(judgmentLineX, trackBaseY, 45, 0, Math.PI * 2); 
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, trackBaseY - 50, canvas.width, 100); 
            
            if (currentCombo >= 2) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 4;
                ctx.fillStyle = '#ffb8b8';
                ctx.font = 'bold 16px Impact, Arial';
                ctx.fillText('COMBO', 110, trackBaseY - 12);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 38px Impact, Arial'; 
                ctx.fillText(currentCombo, 110, trackBaseY + 25);
                ctx.restore();
            }
            
            activeNotes.forEach(note => {
                let xPos = judgmentLineX + ((note.targetOffset - relativeTime) * 400);
                if (note.processed) {
                    let judgment = getJudgmentData(note.hitOffset, note.missedEntirely);
                    let displayOnset = note.hitTimestamp || note.targetOffset + WINDOW_MAX;
                    if (relativeTime <= displayOnset + 0.15) {
                        if (judgment.text !== '') {
                            ctx.save();
                            ctx.font = '900 36px "Arial Black", "Microsoft JhengHei"';
                            ctx.textAlign = 'center';
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 6;
                            ctx.strokeText(judgment.text, judgmentLineX, trackBaseY - 80);
                            ctx.fillStyle = '#ffffff'; 
                            ctx.fillText(judgment.text, judgmentLineX, trackBaseY - 80);
                            ctx.restore();
                        }
                    }
                } else {
                    if (xPos > judgmentLineX - 40 && xPos < canvas.width + 40) {
                        ctx.fillStyle = '#ffffff'; 
                        ctx.beginPath(); ctx.arc(xPos, trackBaseY, 30, 0, Math.PI * 2); ctx.fill();
                    }
                }
            });
            
        } else if (currentMode === 'phigros') {
            let colWidth = canvas.width / 4;
            let keyLabels = ['A', 'S', 'D', 'F'];
            for(let i=0; i<4; i++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.strokeRect(i * colWidth, 0, colWidth, canvas.height);
                ctx.fillStyle = 'rgba(0, 184, 148, 0.08)';
                ctx.fillRect(i * colWidth + 4, canvas.height - 80, colWidth - 8, 25);
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.font = 'bold 15px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(keyLabels[i], i * colWidth + (colWidth / 2), canvas.height - 30);
                ctx.restore();
            }
            if (currentCombo >= 2) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.font = 'bold 55px Impact';
                ctx.fillText(currentCombo, canvas.width / 2, 120);
                ctx.restore();
            }
            activeNotes.forEach(note => {
                let colLeftX = note.column * colWidth;
                let yPos = (canvas.height - 65) - ((note.targetOffset - relativeTime) * 450);
                if (note.processed) {
                    let judgment = getJudgmentData(note.hitOffset, note.missedEntirely);
                    let displayOnset = note.hitTimestamp || note.targetOffset + WINDOW_MAX;
                    if (relativeTime <= displayOnset + 0.15) {
                        if (judgment.text !== '') {
                            ctx.save();
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)'; 
                            ctx.fillRect(colLeftX + 4, canvas.height - 75, colWidth - 8, 15);
                            ctx.font = 'bold 21px Segoe UI';
                            ctx.fillStyle = '#ffffff'; 
                            ctx.textAlign = 'center';
                            ctx.fillText(judgment.text, colLeftX + (colWidth / 2), canvas.height - 105);
                            ctx.restore();
                        }
                    }
                } else {
                    if (yPos > 0 && yPos < canvas.height) {
                        ctx.fillStyle = '#00cec9';
                        ctx.fillRect(colLeftX + 4, yPos - 12, colWidth - 8, 24);
                    }
                }
            });
        }

        let totalRegisteredNotesCount = activeNotes.length;
        let processedNotesCount = 0;
        activeNotes.forEach(note => {
            if (relativeTime > note.targetOffset + WINDOW_MAX && !note.processed) {
                note.hitScore = 0.0;
                note.missedEntirely = true;
                note.processed = true; 
                currentCombo = 0; 
            }
            if (note.processed) processedNotesCount++;
        });
        
        if (processedNotesCount >= totalRegisteredNotesCount && relativeTime >= (maxDurationBeats * BEAT_DURATION)) {
            endQuestion();
        }
        ctx.restore();
        uiOverlay.innerHTML = ''; 
    }

    // 2. Performance Scores Screen Frame Handler
    if (gameState === 'QUESTION_SCORE') {
        let timestampNow = performance.now();
        let limitMaxScore = (currentMode === 'taiko') ? 10.0 : 100.0;

        if (rollingScoreDisplay < targetFinalScore) {
            let elapsed = timestampNow - lastTickTime;
            if (elapsed > 20) {
                rollingScoreDisplay += (currentMode === 'taiko') ? 0.15 : 1.5; 
                if (rollingScoreDisplay > targetFinalScore) rollingScoreDisplay = targetFinalScore;
                playScoreTickSound(rollingScoreDisplay, limitMaxScore);
                lastTickTime = timestampNow;
            }
        } else {
            scoreFinishedRisingGlobal = true;
            let btnNext = document.getElementById('btn-next-step');
            if (btnNext && btnNext.disabled) btnNext.disabled = false;
        }

        ctx.save();
        if (currentMode === 'taiko') {
            let elapsedResultTime = (timestampNow / 1000) - resultViewStartTimestamp;
            let loopedSimulatedTime = (elapsedResultTime % (8 * BEAT_DURATION));
            drawFadedGameplayBackground(loopedSimulatedTime, phoneHorizontalScoreShiftY);
        }

        if (currentMode === 'taiko') {
            ctx.save();
            if (isMobilePhone) {
                ctx.translate(canvas.width * 0.025, canvas.height * 0.025);
                ctx.scale(0.95, 0.95);
            }

            // Downward adjustment of 1/4 screen size for Round indicator, total score, and commentary
            ctx.save();
            ctx.fillStyle = '#a4b0be';
            ctx.font = 'bold 24px Arial, sans-serif';
            let scoreRoundY = isMobilePhone && isLandscape ? 120 + phoneHorizontalScoreShiftY : 65;
            ctx.fillText(`${currentQuestionIndex + 1} / 5`, 50, scoreRoundY);
            ctx.restore();

            ctx.save();
            ctx.textAlign = 'right';
            ctx.font = '900 82px Helvetica Neue, Arial, sans-serif';
            ctx.fillStyle = '#ffffff';
            let scoreTextY = isMobilePhone && isLandscape ? 185 + phoneHorizontalScoreShiftY : 130;
            ctx.fillText(`${rollingScoreDisplay.toFixed(2)}`, canvas.width - 50, scoreTextY);
            ctx.restore();

            if (scoreFinishedRisingGlobal) {
                ctx.save();
                ctx.textAlign = 'right';
                ctx.font = 'bold 24px Microsoft JhengHei, sans-serif';
                ctx.fillStyle = '#a4b0be';
                let commentaryTextY = isMobilePhone && isLandscape ? 240 + phoneHorizontalScoreShiftY : 185;
                ctx.fillText(currentActiveCommentary, canvas.width - 50, commentaryTextY);
                ctx.restore();
            }
            ctx.restore();
        } else {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.fillStyle = '#00cec9';
            ctx.font = 'bold 24px Segoe UI, sans-serif';
            ctx.fillText('TRACK PERFORMANCE', canvas.width / 2, 120);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 74px Helvetica Neue, sans-serif';
            ctx.fillText(`${rollingScoreDisplay.toFixed(2)}`, canvas.width / 2, 220);
            
            if (scoreFinishedRisingGlobal) {
                ctx.fillStyle = '#747d8c';
                ctx.font = 'bold 18px Microsoft JhengHei, sans-serif';
                ctx.fillText(currentActiveCommentary, canvas.width / 2, 290);
            }
            ctx.restore();
        }

        // Exact horizontal axis lock alignment for both "稍慢" Evaluation and "下一步" button
        if (scoreFinishedRisingGlobal && currentMode === 'taiko') {
            ctx.save();
            if (isMobilePhone) {
                ctx.translate(canvas.width * 0.025, canvas.height * 0.025);
                ctx.scale(0.95, 0.95);
            }
            let displayTrendString = "";
            if (validHitsCount > 0) {
                let trueMean = validHitsOffsetSum / validHitsCount; 
                if (trueMean > 0.05) displayTrendString = "太慢";
                else if (trueMean > 0.01) displayTrendString = "稍慢";
                else if (trueMean < -0.05) displayTrendString = "太快";
                else if (trueMean < -0.01) displayTrendString = "稍快";
                else displayTrendString = "完美";
            } else {
                displayTrendString = "全數落空";
            }

            ctx.fillStyle = "#ffffff";
            ctx.font = '900 54px "Microsoft JhengHei", Arial, sans-serif'; 
            
            // Set uniform Y position coordinate vector (Y = 410) inside canvas boundaries
            let finalEvaluationY = (isMobilePhone && isLandscape) ? 410 : 465;
            ctx.fillText(displayTrendString, 50, finalEvaluationY);
            ctx.restore();
        }
        ctx.restore();
        uiOverlay.innerHTML = ''; 
    }

    // 3. Overall Summary Grand Score Matrix
    if (gameState === 'FINAL_SCOREBOARD') {
        let timestampNow = performance.now();
        let totalScoreFinishedRising = false;

        if (rollingScoreDisplay < targetFinalScore) {
            let elapsed = timestampNow - lastTickTime;
            if (elapsed > 20) {
                rollingScoreDisplay += 0.65; 
                if (rollingScoreDisplay > targetFinalScore) rollingScoreDisplay = targetFinalScore;
                playScoreTickSound(rollingScoreDisplay, 50.0);
                lastTickTime = timestampNow;
            }
        } else {
            totalScoreFinishedRising = true;
        }

        ctx.save();
        if (currentMode === 'taiko' && isMobilePhone && isLandscape) {
            ctx.translate(0, canvas.height * 0.25);
        }
        ctx.save();
        if (isMobilePhone) {
            ctx.translate(canvas.width * 0.025, canvas.height * 0.025);
            ctx.scale(0.95, 0.95);
        }

        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '900 105px Helvetica Neue, Arial, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${rollingScoreDisplay.toFixed(2)}`, canvas.width / 2, 145);
        
        let mainTextWidth = ctx.measureText(`${rollingScoreDisplay.toFixed(2)}`).width;
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.font = 'bold 48px Helvetica Neue, Arial, sans-serif';
        ctx.fillText('/50', (canvas.width / 2) + (mainTextWidth / 2) + 5, 135);
        ctx.restore();

        if (totalScoreFinishedRising) {
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = 'bold 26px Microsoft JhengHei, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(currentActiveCommentary, canvas.width / 2, 215);
            ctx.restore();
        }

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(80, 260); ctx.lineTo(720, 260); ctx.stroke();

        ctx.save();
        ctx.textAlign = 'center';
        let segmentSpacing = 130; 
        let matrixStartLeftX = canvas.width / 2 - (2 * segmentSpacing);

        for (let i = 0; i < 5; i++) {
            let computedX = matrixStartLeftX + (i * segmentSpacing);
            let scoreVal = questionScores[i] || 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.font = 'bold 20px Arial, sans-serif';
            ctx.fillText(`${i + 1}`, computedX, 320);

            if (totalScoreFinishedRising) {
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px Arial, sans-serif';
                ctx.fillText(scoreVal.toFixed(1), computedX, 385);
            } else {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.font = 'bold 36px Arial, sans-serif';
                ctx.fillText("0.0", computedX, 385);
            }
        }
        ctx.restore();
        ctx.restore();
        ctx.restore();
        uiOverlay.innerHTML = "";
    }

    requestAnimationFrame(gameLoop);
}
</script>
</body>
