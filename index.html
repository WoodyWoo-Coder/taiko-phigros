<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>擊擊復擊擊 - Percussion Practice Suite</title>
    <style>
        body {
            background-color: #0c0c0e;
            color: #ffffff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        #game-container { text-align: center; position: relative; max-width: 850px; }
        h1 { font-size: 36px; margin-bottom: 5px; color: #00cec9; letter-spacing: 3px; }
        .credits { font-size: 14px; color: #747d8c; margin-bottom: 25px; }
        
        /* Layout Structure styling */
        .mode-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        
        canvas {
            border: 4px solid #2f3542;
            background-color: #151518;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 6px;
        }
        #ui-overlay { margin-top: 15px; font-size: 18px; min-height: 45px; color: #eccc68; font-weight: 500; }
        
        /* Button Configurations */
        .btn {
            background: #2f3542;
            color: #a4b0be;
            border: 2px solid #57606f;
            padding: 14px 32px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .btn.selected {
            background: #00cec9;
            color: #0c0c0e;
            border-color: #00cec9;
            box-shadow: 0 0 15px rgba(0, 206, 201, 0.4);
        }
        .btn-action {
            background: #ff4757;
            color: #ffffff;
            border: none;
            padding: 16px 48px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            border-radius: 6px;
            margin-top: 15px;
            box-shadow: 0 4px 14px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }
        .btn-action:disabled {
            background: #2f3542 !important;
            color: #57606f !important;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.5;
        }
        .btn-action:hover:not(:disabled) { background: #ff6b81; transform: translateY(-2px); }
        
        /* Tutorial Panel rules */
        #tutorial-panel {
            background: #1e1e24;
            border: 2px solid #2f3542;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        #tutorial-panel h3 { color: #00cec9; margin-top: 0; }
        #tutorial-panel code { background: #0c0c0e; padding: 2px 6px; border-radius: 4px; color: #ff7f50; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menu">
        <h1>擊擊復擊擊</h1>
        <div class="credits">製作者: 郭覲德 林映澄</div>
        
        <div id="tutorial-panel">
            <h3>玩法教學 (Tutorial)</h3>
            • <b>太鼓模式：</b>音符抵達左側判定圈時，按下 <code>空白鍵 (Space)</code> 進行敲擊。<br>
            • <b>音遊模式：</b>矩形條由上往下掉落，抵達底部判定線時，按對應軌道鍵 <code>C</code> <code>V</code> <code>B</code> <code>N</code> 進行敲擊。<br>
            • <b>判定精準度：</b>越接近完美時間點分數越高，分為 <span style="color:#2ecc71">PERFECT</span>、<span style="color:#f1c40f">GOOD</span>、<span style="color:#e67e22">BAD</span>、<span style="color:#ff4d4d">MISS</span>。
        </div>

        <div class="mode-container">
            <button id="btn-taiko" class="btn" onclick="selectMode('taiko')">太鼓模式</button>
            <button id="btn-phigros" class="btn" onclick="selectMode('phigros')">音遊模式</button>
        </div>
        
        <button id="btn-start" class="btn-action" onclick="startGame()" disabled>開始遊戲</button>
    </div>

    <canvas id="gameCanvas" width="800" height="520" style="display:none;"></canvas>
    <div id="ui-overlay"></div>
    <div id="action-btn-container"></div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const menu = document.getElementById('menu');
const actionBtnContainer = document.getElementById('action-btn-container');

// Mode buttons references
const btnTaiko = document.getElementById('btn-taiko');
const btnPhigros = document.getElementById('btn-phigros');
const btnStart = document.getElementById('btn-start');

// --- ENGINE CONSTANTS (60 BPM) ---
const BPM = 60;
const BEAT_DURATION = 60 / BPM; 
const SUB_BEAT_DURATION = BEAT_DURATION / 4; 
const WINDOW_MAX = 0.125; 

const BEAT_PATTERNS = {
    1: [1, 0, 0, 0], 2: [1, 0, 1, 0], 3: [1, 1, 1, 1], 4: [1, 0, 1, 1],
    5: [1, 1, 1, 0], 6: [1, 1, 0, 1], 7: [1, 1, 0, 0], 8: [1, 0, 0, 1]
};

// --- AUDIO SYNTHESIS SYSTEM ---
let audioCtx = null;

// Cold-boot audio setup to eliminate first beat lag entirely
function warmupAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playHitSound() {
    warmupAudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime); 
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.20); 
    osc.start();
    osc.stop(audioCtx.currentTime + 0.20);
}

// Re-tuned Pure 8-bit Mario Kart Starting Sound Engine
function scheduleBeep(frequency, startTime, duration, step) {
    warmupAudioContext();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = 'square'; 
    osc.frequency.setValueAtTime(frequency, startTime);

    gainNode.gain.setValueAtTime(0.2, startTime); 
    
    if (step === 4) {
        // High sprint finish held crisp for 0.5s total duration
        gainNode.gain.setValueAtTime(0.2, startTime + 0.3);
        gainNode.gain.linearRampToValueAtTime(0.0, startTime + duration);
    } else {
        gainNode.gain.setValueAtTime(0.2, startTime + duration - 0.01);
        gainNode.gain.linearRampToValueAtTime(0.0, startTime + duration);
    }

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.start(startTime);
    osc.stop(startTime + duration);
}

function playScoreTickSound(val, maxVal) {
    warmupAudioContext();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    let ratio = val / maxVal;
    osc.frequency.setValueAtTime(150 + (ratio * 400), audioCtx.currentTime);
    gain.gain.setValueAtTime(0.10, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
}

// --- ASSET MANAGEMENT ---
const images = {};
for (let i = 1; i <= 8; i++) {
    images[i] = new Image();
    images[i].src = `${i}.jpg`;
}

// --- STATE MANAGEMENT ---
let currentMode = '';
let gameState = 'START'; 
let currentQuestionIndex = 0;
let questions = [];
let questionScores = [];
let activeNotes = [];
let timelineStartTime = 0; 
let lastCountdownBeatRegistered = -1;

// Scoreboard Machine Variables
let rollingScoreDisplay = 0.0;
let targetFinalScore = 0.0;
let lastTickTime = 0;

function selectMode(mode) {
    currentMode = mode;
    
    // Warm up pipeline on initial input interaction to defeat audio lag
    warmupAudioContext();
    
    if (mode === 'taiko') {
        btnTaiko.classList.add('selected');
        btnPhigros.classList.remove('selected');
    } else {
        btnPhigros.classList.add('selected');
        btnTaiko.classList.add('selected');
        btnTaiko.classList.remove('selected');
    }
    
    btnStart.disabled = false;
    btnStart.style.background = '#00cec9';
    btnStart.style.color = '#0c0c0e';
}

function startGame() {
    if (!currentMode) return;

    warmupAudioContext();
    menu.style.display = 'none';
    canvas.style.display = 'block';
    generateSession();
    buildTimelineForQuestion();
    requestAnimationFrame(gameLoop);
}

function generateSession() {
    questions = [];
    questionScores = [];
    currentQuestionIndex = 0;
    for(let i = 0; i < 5; i++) {
        let patternCombination = [];
        for(let j = 0; j < 4; j++) {
            patternCombination.push(Math.floor(Math.random() * 5) + 1);
        }
        questions.push(patternCombination);
    }
}

function calculateAccuracyScore(offset) {
    let x = Math.abs(offset);
    if (x >= 0.120) return 0.0;
    let score = 10.0 * Math.exp(-252 * (x * x));
    return Math.max(0.0, Math.min(10.0, score));
}

function getJudgmentData(offset, isMissedEntirely) {
    if (isMissedEntirely) return { color: '#ff4d4d', text: 'MISS' }; 
    let absOffset = Math.abs(offset);
    if (absOffset <= 0.030) return { color: '#2ecc71', text: 'PERFECT' };   
    if (absOffset <= 0.060) return { color: '#f1c40f', text: 'GOOD' };      
    if (absOffset <= 0.120) return { color: '#e67e22', text: 'BAD' };       
    return { color: '#ff4d4d', text: 'MISS' };                              
}

function buildTimelineForQuestion() {
    gameState = 'TIMELINE_RUNNING';
    actionBtnContainer.innerHTML = '';
    
    // Ensure accurate syncing across frame execution bounds
    warmupAudioContext();
    timelineStartTime = performance.now() / 1000;
    lastCountdownBeatRegistered = -1;
    activeNotes = [];
    
    let patternIDs = questions[currentQuestionIndex];
    let noteIdCounter = 0;
    
    for (let beatIdx = 0; beatIdx < 4; beatIdx++) {
        let patternNum = patternIDs[beatIdx];
        let subBeatMask = BEAT_PATTERNS[patternNum];
        
        for (let subIdx = 0; subIdx < 4; subIdx++) {
            if (subBeatMask[subIdx] === 1) {
                let targetTime = (4 * BEAT_DURATION) + (beatIdx * BEAT_DURATION) + (subIdx * SUB_BEAT_DURATION);
                let randomizedColumn = Math.floor(Math.random() * 4); 
                
                activeNotes.push({
                    id: noteIdCounter++, 
                    targetOffset: targetTime,
                    column: randomizedColumn,
                    patternOrigin: patternNum,
                    hitScore: null,
                    hitOffset: null,
                    processed: false,   
                    missedEntirely: false
                });
            }
        }
    }
}

function endQuestion() {
    gameState = 'QUESTION_SCORE';
    let totalNotes = activeNotes.length;
    let accumulated = 0;
    activeNotes.forEach(note => { accumulated += note.hitScore; });
    
    let avg = totalNotes > 0 ? accumulated / totalNotes : 0.0;
    questionScores.push(avg);
    
    rollingScoreDisplay = 0.0;
    targetFinalScore = avg;
    lastTickTime = performance.now();

    if (currentQuestionIndex < 4) {
        actionBtnContainer.innerHTML = `<button class="btn-action" style="margin-top:0;" onclick="nextQuestion()">下一題</button>`;
    } else {
        actionBtnContainer.innerHTML = `<button class="btn-action" style="margin-top:0;" onclick="showGrandScoreboard()">結算總成績</button>`;
    }
}

function nextQuestion() {
    currentQuestionIndex++;
    buildTimelineForQuestion();
}

function showGrandScoreboard() {
    rollingScoreDisplay = 0.0;
    targetFinalScore = questionScores.reduce((a, b) => a + b, 0);
    lastTickTime = performance.now();
    actionBtnContainer.innerHTML = `<button class="btn-action" style="margin-top:0;" onclick="location.reload()">再玩一次</button>`;
    gameState = 'FINAL_SCOREBOARD';
}

function handleHit(forcedColumn = null) {
    if (gameState !== 'TIMELINE_RUNNING') return;
    
    let relativeTime = (performance.now() / 1000) - timelineStartTime;
    let countdownEndTime = 4 * BEAT_DURATION;
    
    if (relativeTime >= (countdownEndTime - WINDOW_MAX)) {
        playHitSound();
    }
    
    for (let i = 0; i < activeNotes.length; i++) {
        let note = activeNotes[i];
        
        if (!note.processed) {
            if (forcedColumn !== null && note.column !== forcedColumn) {
                continue; 
            }
            
            let timeDifference = relativeTime - note.targetOffset;
            if (Math.abs(timeDifference) <= WINDOW_MAX) {
                note.hitOffset = timeDifference;
                note.hitScore = calculateAccuracyScore(timeDifference);
                note.processed = true; 
                note.hitTimestamp = relativeTime;
                break; 
            }
        }
    }
}

// --- DESKTOP COMPUTER MAPPING ---
window.addEventListener('keydown', (e) => { 
    if (currentMode === 'taiko' && e.code === 'Space') {
        e.preventDefault();
        handleHit(null);
    } 
    else if (currentMode === 'phigros') {
        let targets = { 'KeyC': 0, 'KeyV': 1, 'KeyB': 2, 'KeyN': 3 };
        if (targets[e.code] !== undefined) {
            e.preventDefault();
            handleHit(targets[e.code]);
        }
    }
});

// --- SMART PHONE SCREEN TOUCH SYSTEM ---
canvas.addEventListener('touchstart', (e) => {
    if (gameState !== 'TIMELINE_RUNNING') return;
    e.preventDefault(); 
    
    let rect = canvas.getBoundingClientRect();
    
    if (currentMode === 'taiko') {
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            let touchX = ((touch.clientX - rect.left) / rect.width) * canvas.width;
            let touchY = ((touch.clientY - rect.top) / rect.height) * canvas.height;
            
            let distance = Math.sqrt(Math.pow(touchX - 150, 2) + Math.pow(touchY - 320, 2));
            if (distance <= 65) {
                handleHit(null);
            }
        }
    } 
    else if (currentMode === 'phigros') {
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            let canvasRelativeX = touch.clientX - rect.left;
            
            let calculatedColumn = Math.floor((canvasRelativeX / rect.width) * 4);
            calculatedColumn = Math.max(0, Math.min(3, calculatedColumn));
            
            handleHit(calculatedColumn);
        }
    }
}, {passive: false});

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let timeNow = performance.now() / 1000;
    let relativeTime = timeNow - timelineStartTime;
    let countdownEndTime = 4 * BEAT_DURATION;
    
    if (gameState !== 'FINAL_SCOREBOARD') {
        let patternIDs = questions[currentQuestionIndex];
        ctx.fillStyle = '#1e1e24';
        ctx.fillRect(0, 0, canvas.width, 110);
        
        let currentActiveImageIndex = -1;
        if (gameState === 'TIMELINE_RUNNING' && relativeTime >= countdownEndTime) {
            currentActiveImageIndex = Math.floor((relativeTime - countdownEndTime) / BEAT_DURATION);
        }
        
        let imgWidth = canvas.width / 4; 
        for (let i = 0; i < 4; i++) {
            let imgId = patternIDs[i];
            let xPos = i * imgWidth;
            
            if (images[imgId] && images[imgId].complete) {
                ctx.drawImage(images[imgId], xPos, 0, imgWidth, 110);
            } else {
                ctx.strokeStyle = '#3a3a44';
                ctx.strokeRect(xPos, 0, imgWidth, 110);
                ctx.fillStyle = '#fff';
                ctx.font = '14px Segoe UI';
                ctx.fillText(`節奏型圖卡 ${imgId}.jpg`, xPos + 40, 60);
            }
            
            if (i === currentActiveImageIndex) {
                ctx.strokeStyle = '#00cec9';
                ctx.lineWidth = 4;
                ctx.strokeRect(xPos + 2, 2, imgWidth - 4, 106);
            }
        }
    }

    if (gameState === 'TIMELINE_RUNNING') {
        if (relativeTime < countdownEndTime) {
            let currentCountdownBeat = Math.floor(relativeTime / BEAT_DURATION);
            if (currentCountdownBeat !== lastCountdownBeatRegistered && currentCountdownBeat < 4) {
                lastCountdownBeatRegistered = currentCountdownBeat;
                
                let ctxTime = audioCtx.currentTime;
                // Perfected arcade frequency pairings: 470Hz low beeps, 940Hz high start tone
                if (currentCountdownBeat === 0) scheduleBeep(470, ctxTime, 0.12, 1);
                else if (currentCountdownBeat === 1) scheduleBeep(470, ctxTime, 0.12, 2);
                else if (currentCountdownBeat === 2) scheduleBeep(470, ctxTime, 0.12, 3);
                else if (currentCountdownBeat === 3) scheduleBeep(940, ctxTime, 0.50, 4);
            }
        }

        if (currentMode === 'taiko') {
            let judgmentLineX = 150;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 4;
            ctx.beginPath(); 
            ctx.arc(judgmentLineX, 320, 45, 0, Math.PI * 2); 
            ctx.stroke();
            
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, 270, canvas.width, 100); 
            
            activeNotes.forEach(note => {
                let xPos = judgmentLineX + ((note.targetOffset - relativeTime) * 400);
                
                if (note.processed) {
                    let judgment = getJudgmentData(note.hitOffset, note.missedEntirely);
                    
                    // Display window fine-tuned to exactly 0.15s
                    let displayOnset = note.hitTimestamp || note.targetOffset + WINDOW_MAX;
                    if (relativeTime <= displayOnset + 0.15) {
                        ctx.save();
                        ctx.fillStyle = judgment.color;
                        // 1.5x Size amplification (scaled cleanly from bold 12px up to bold 18px)
                        ctx.font = 'bold 18px Segoe UI';
                        ctx.textAlign = 'center';
                        // Renders straight up directly above the stationary target lane ring zone
                        ctx.fillText(judgment.text, judgmentLineX, 250);
                        ctx.restore();
                    }
                    
                    if (note.missedEntirely && xPos > 0 && xPos < canvas.width) {
                        ctx.fillStyle = judgment.color;
                        ctx.beginPath(); ctx.arc(xPos, 320, 20, 0, Math.PI * 2); ctx.fill();
                    }
                } else {
                    if (xPos > judgmentLineX - 40 && xPos < canvas.width + 40) {
                        ctx.fillStyle = '#ffffff'; 
                        ctx.beginPath(); ctx.arc(xPos, 320, 30, 0, Math.PI * 2); ctx.fill();
                    }
                }
            });
            
        } else if (currentMode === 'phigros') {
            let colWidth = canvas.width / 4;
            for(let i=0; i<4; i++) {
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.strokeRect(i * colWidth, 110, colWidth, canvas.height - 110);
                ctx.fillStyle = 'rgba(0, 184, 148, 0.1)';
                ctx.fillRect(i * colWidth + 4, canvas.height - 60, colWidth - 8, 25);
            }
            
            activeNotes.forEach(note => {
                let colLeftX = note.column * colWidth;
                let yPos = (canvas.height - 45) - ((note.targetOffset - relativeTime) * 450);
                
                if (note.processed) {
                    let judgment = getJudgmentData(note.hitOffset, note.missedEntirely);
                    
                    // Display window fine-tuned to exactly 0.15s
                    let displayOnset = note.hitTimestamp || note.targetOffset + WINDOW_MAX;
                    if (relativeTime <= displayOnset + 0.15) {
                        ctx.save();
                        ctx.fillStyle = judgment.color;
                        ctx.fillRect(colLeftX + 6, canvas.height - 55, colWidth - 12, 15);
                        // 1.5x Size amplification (scaled cleanly from bold 14px up to bold 21px)
                        ctx.font = 'bold 21px Segoe UI';
                        ctx.textAlign = 'center';
                        ctx.fillText(judgment.text, colLeftX + (colWidth / 2), canvas.height - 75);
                        ctx.restore();
                    }
                } else {
                    if (yPos > 110 && yPos < canvas.height) {
                        ctx.fillStyle = '#00cec9';
                        ctx.fillRect(colLeftX + 6, yPos - 12, colWidth - 12, 24);
                    }
                }
            });
        }

        // --- Mario Kart Traffic Starter Light Display Module ---
        if (relativeTime < countdownEndTime) {
            let activeLightIndex = Math.floor(relativeTime / BEAT_DURATION); 
            let lightY = 220;
            let lightRadius = 25;
            let gap = 70;
            let startX = canvas.width / 2 - gap;

            ctx.save();
            for (let i = 0; i < 3; i++) {
                let currentLightX = startX + (i * gap);
                
                ctx.beginPath();
                ctx.arc(currentLightX, lightY, lightRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#33333d';
                ctx.fill();
                ctx.strokeStyle = '#55555f';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (activeLightIndex < 3) {
                    if (i <= activeLightIndex) {
                        ctx.beginPath();
                        ctx.arc(currentLightX, lightY, lightRadius - 2, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff4757'; 
                        ctx.shadowColor = '#ff4757';
                        ctx.shadowBlur = 20;
                        ctx.fill();
                    }
                } else {
                    ctx.beginPath();
                    ctx.arc(currentLightX, lightY, lightRadius - 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#2ed573'; 
                    ctx.shadowColor = '#2ed573';
                    ctx.shadowBlur = 20;
                    ctx.fill();
                }
            }
            ctx.restore();
            uiOverlay.innerHTML = ''; 
        } else {
            let playedCount = 0;
            activeNotes.forEach(note => {
                if (relativeTime > note.targetOffset + WINDOW_MAX && !note.processed) {
                    note.hitScore = 0.0;
                    note.missedEntirely = true;
                    note.processed = true; 
                }
                if (note.processed) playedCount++;
            });
            
            // Clean interface: removed beat-by-beat real-time log string metrics down below
            uiOverlay.innerHTML = `當前關卡題目: ${currentQuestionIndex + 1}/5 | 已評估音符: ${playedCount}/${activeNotes.length}`;
        }
        
        if (relativeTime >= (8 * BEAT_DURATION)) {
            endQuestion();
        }
    }

    if (gameState === 'QUESTION_SCORE') {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px Segoe UI';
        ctx.fillText(`第 ${currentQuestionIndex + 1} 題 挑戰完成`, 290, 220);
        
        let timestampNow = performance.now();
        if (rollingScoreDisplay < targetFinalScore) {
            let elapsed = timestampNow - lastTickTime;
            if (elapsed > 20) {
                rollingScoreDisplay += 0.15; 
                if (rollingScoreDisplay > targetFinalScore) rollingScoreDisplay = targetFinalScore;
                
                playScoreTickSound(rollingScoreDisplay, 10.0);
                lastTickTime = timestampNow;
            }
        }

        ctx.font = 'bold 46px Segoe UI';
        ctx.fillStyle = '#eccc68';
        ctx.fillText(`${rollingScoreDisplay.toFixed(2)} / 10.00`, 285, 300);
        
        uiOverlay.innerHTML = `請準備迎接下一小節的節奏`; 
    }

    if (gameState === 'FINAL_SCOREBOARD') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px Segoe UI';
        ctx.fillText('全關卡總結算成績單', 270, 140);
        
        ctx.font = '20px Segoe UI';
        for (let i = 0; i < 5; i++) {
            let score = questionScores[i] || 0;
            ctx.fillStyle = '#a4b0be';
            ctx.fillText(`第 ${i + 1} 題 得分: .................... ${score.toFixed(2)} / 10.0`, 210, 200 + (i * 35));
        }
        
        ctx.strokeStyle = '#2f3542';
        ctx.beginPath(); ctx.moveTo(200, 385); ctx.lineTo(600, 385); ctx.stroke();
        
        let timestampNow = performance.now();
        if (rollingScoreDisplay < targetFinalScore) {
            let elapsed = timestampNow - lastTickTime;
            if (elapsed > 20) {
                rollingScoreDisplay += 0.65; 
                if (rollingScoreDisplay > targetFinalScore) rollingScoreDisplay = targetFinalScore;
                
                playScoreTickSound(rollingScoreDisplay, 50.0);
                lastTickTime = timestampNow;
            }
        }
        
        ctx.font = 'bold 28px Segoe UI';
        ctx.fillStyle = '#00cec9';
        ctx.fillText(`總體累積得分: ...... ${rollingScoreDisplay.toFixed(2)} / 50.00`, 210, 430);
        uiOverlay.innerHTML = "本次練習測試已全部結束！";
    }

    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
